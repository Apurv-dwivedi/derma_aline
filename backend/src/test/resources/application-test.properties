# ==============================================================================
# ISOLATED SPRING BOOT TEST CONFIGURATION (NO PRODUCTION CREDENTIALS OR DB)
# ==============================================================================
# Uses in-memory H2 configured in PostgreSQL compatibility mode so application
# context startup, security filters, JPA locking, and concurrency tests never
# touch or depend on the live Supabase PostgreSQL database.

spring.datasource.url=jdbc:h2:mem:derma_aline_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Clear PostgreSQL PgBouncer-specific Hikari properties for H2 test pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Synthetic Test-Only Security & Mail Settings (never real credentials)
app.jwt.secret=SyntheticUnitAndContextTestJwtSecretKeyWithAtLeast64Bytes2026!!
app.jwt.expiration-milliseconds=3600000
app.jwt.allow-ephemeral-fallback=false

app.admin.email=
app.admin.password=
app.staff.email=
app.staff.password=

app.supabase.url=
app.supabase.anon-key=
app.supabase.jwt-secret=

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
